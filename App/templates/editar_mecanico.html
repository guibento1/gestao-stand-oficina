{% extends 'base.html' %}

{% block title %}Editar Mecânico - Auto Care{% endblock %}

{% block content %}
<div class="page-container">
    <h1>✏️ Editar Mecânico</h1>
    
    <div class="card form-card">
        <form method="POST">
            {% csrf_token %}
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" value="{{ mecanico.nome }}" required>
                </div>
                <div class="form-group">
                    <label for="especialidade">Especialidade *</label>
                    <select id="especialidade" name="especialidade" required>
                        <option value="Motor" {% if mecanico.especialidade == 'Motor' %}selected{% endif %}>Motor</option>
                        <option value="Elétrica" {% if mecanico.especialidade == 'Elétrica' %}selected{% endif %}>Elétrica</option>
                        <option value="Suspensão" {% if mecanico.especialidade == 'Suspensão' %}selected{% endif %}>Suspensão</option>
                        <option value="Travões" {% if mecanico.especialidade == 'Travões' %}selected{% endif %}>Travões</option>
                        <option value="Ar Condicionado" {% if mecanico.especialidade == 'Ar Condicionado' %}selected{% endif %}>Ar Condicionado</option>
                        <option value="Geral" {% if mecanico.especialidade == 'Geral' %}selected{% endif %}>Geral</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="text" id="telefone" name="telefone" value="{{ mecanico.telefone }}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ mecanico.email }}">
                </div>
                <div class="form-group">
                    <label for="stand_id">Stand *</label>
                    <select id="stand_id" name="stand_id" required>
                        {% for stand in stands %}
                        <option value="{{ stand.id }}" {% if stand.id == mecanico.stand_id %}selected{% endif %}>{{ stand.nome }} - {{ stand.localizacao }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="salario">Salário</label>
                    <input type="number" id="salario" name="salario" step="0.01" min="0" value="{{ mecanico.salario }}">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Guardar</button>
                <a href="{% url 'mecanicos' %}" class="btn btn-secondary">← Voltar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
