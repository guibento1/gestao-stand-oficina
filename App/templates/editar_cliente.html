{% extends 'base.html' %}

{% block title %}Editar Cliente - Auto Care Stand{% endblock %}

{% block content %}
<div class="page">
    <h1>✏️ Editar Cliente</h1>
    <p class="subtitle">A editar: {{ cliente.c_nome }}</p>

    <div class="add-form-section" style="max-width: 600px;">
        <form method="post" class="form">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label for="c_nome">Nome:</label>
                    <input type="text" id="c_nome" name="c_nome" value="{{ cliente.c_nome }}" required>
                </div>

                <div class="form-group">
                    <label for="c_email">Email:</label>
                    <input type="email" id="c_email" name="c_email" value="{{ cliente.c_email }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="c_telefone">Telefone:</label>
                    <input type="text" id="c_telefone" name="c_telefone" value="{{ cliente.c_telefone }}" required>
                </div>

                <div class="form-group">
                    <label for="nif">NIF:</label>
                    <input type="text" id="nif" name="nif" value="{{ cliente.nif }}" required>
                </div>
            </div>

            <div class="form-actions">
                <a href="{% url 'clientes' %}" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-success">💾 Guardar Alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
