{% extends 'base.html' %}

{% block title %}Logout - Auto Care Stand{% endblock %}

{% block content %}
<div class="page">
    <div class="logout-container" style="text-align: center;">
        <h1>🚪 Logout</h1>
        
        <p style="margin: 20px 0; color: var(--text-muted);">
            Tem a certeza que deseja sair da sua conta?
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-actions" style="justify-content: center;">
                <a href="{% url 'home' %}" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-danger">Confirmar Logout</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
